<svg xmlns="http://www.w3.org/2000/svg" width="852" height="1280" viewBox="0 0 852 1280" role="img" aria-labelledby="title desc">
  <title id="title">The Men Behind A Desire Women — a novel by Amim Ahsan</title>
  <desc id="desc">An ink-dark Dhaka cover: a rain-streaked window above a writer's desk, a lamp burning over a hand-bound manuscript, a fountain pen and a curl of cigarette smoke, with a woman's silhouette fading in the wet glass beneath the title The Men Behind A Desire Women.</desc>

  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#08131a"/>
      <stop offset="0.4" stop-color="#0b1f28"/>
      <stop offset="0.74" stop-color="#07141a"/>
      <stop offset="1" stop-color="#03090d"/>
    </linearGradient>
    <radialGradient id="lampHalo" cx="50%" cy="58%" r="46%">
      <stop offset="0" stop-color="#f6d49a" stop-opacity="0.42"/>
      <stop offset="0.42" stop-color="#d9a866" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe6b8" stop-opacity="0.98"/>
      <stop offset="0.3" stop-color="#f0bd78" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e0a05a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ecd9"/>
      <stop offset="1" stop-color="#e3d5ba"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a1c"/>
      <stop offset="1" stop-color="#140e09"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5ba8c"/>
      <stop offset="0.45" stop-color="#c98b55"/>
      <stop offset="1" stop-color="#8c5730"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#cfd8d6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#cfd8d6" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="paperGrain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.55" fill="#6b5334" opacity="0.10"/>
      <circle cx="5" cy="4" r="0.4" fill="#6b5334" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="852" height="1280" fill="url(#night)"/>
  <rect width="852" height="1280" fill="url(#lampHalo)"/>

  <!-- rain-streaked window -->
  <g>
    <rect x="96" y="404" width="660" height="432" rx="10" fill="#0a2029"/>
    <rect x="96" y="404" width="660" height="432" rx="10" fill="none" stroke="#4a3a28" stroke-width="10" opacity="0.85"/>
    <line x1="426" y1="408" x2="426" y2="832" stroke="#4a3a28" stroke-width="7" opacity="0.6"/>
    <line x1="100" y1="620" x2="752" y2="620" stroke="#4a3a28" stroke-width="7" opacity="0.45"/>

    <!-- city beyond the wet glass -->
    <g opacity="0.55">
      <path d="M110 720 L150 720 L150 640 L196 640 L196 700 L242 700 L242 588 L288 588 L288 676 L330 676 L330 632 L372 632 L372 704 L420 704 L420 664 L470 664 L470 712 L520 712 L520 604 L566 604 L566 690 L612 690 L612 648 L654 648 L654 712 L700 712 L700 620 L742 620 L742 760 L110 760 Z" fill="#0d2a33"/>
      <g fill="#f3d9a6" opacity="0.5">
        <rect x="156" y="656" width="5" height="7"/><rect x="170" y="676" width="5" height="7"/>
        <rect x="252" y="604" width="5" height="7"/><rect x="268" y="628" width="5" height="7"/>
        <rect x="340" y="648" width="5" height="7"/><rect x="530" y="622" width="5" height="7"/>
        <rect x="548" y="650" width="5" height="7"/><rect x="712" y="640" width="5" height="7"/>
      </g>
    </g>
    <circle cx="660" cy="500" r="46" fill="#e9dcbe" opacity="0.16" filter="url(#soft)"/>

    <!-- the woman in the glass, fading -->
    <g opacity="0.32" filter="url(#soft)">
      <path d="M508 640 C500 618 506 596 520 588 C536 578 552 590 554 608 C556 626 546 638 538 646 L560 664 C584 686 590 716 590 748 L472 748 C470 714 478 682 500 662 Z" fill="#e6cfae"/>
      <path d="M514 588 C520 574 540 572 548 584 C554 594 550 606 540 610 C528 614 516 602 514 588 Z" fill="#f2e2c6"/>
    </g>

    <!-- rain -->
    <g stroke="#bcd6d6" stroke-width="1.3" opacity="0.22">
      <path d="M140 420 L128 470"/><path d="M188 440 L176 492"/><path d="M232 412 L220 462"/>
      <path d="M282 470 L270 522"/><path d="M334 430 L322 484"/><path d="M380 470 L368 524"/>
      <path d="M438 418 L426 468"/><path d="M486 460 L474 512"/><path d="M536 424 L524 474"/>
      <path d="M588 466 L576 518"/><path d="M640 420 L628 472"/><path d="M692 462 L680 514"/>
      <path d="M158 540 L146 592"/><path d="M212 590 L200 644"/><path d="M300 566 L288 620"/>
      <path d="M362 606 L350 660"/><path d="M444 560 L432 614"/><path d="M506 598 L494 652"/>
      <path d="M570 552 L558 606"/><path d="M630 596 L618 650"/><path d="M700 552 L688 606"/>
      <path d="M124 700 L112 754"/><path d="M248 706 L236 760"/><path d="M396 700 L384 754"/>
      <path d="M462 728 L450 782"/><path d="M604 706 L592 760"/><path d="M726 690 L714 744"/>
    </g>
    <g stroke="#e8d8b8" stroke-width="1" opacity="0.16">
      <path d="M176 428 Q184 470 172 516"/><path d="M328 452 Q338 500 322 556"/>
      <path d="M482 436 Q492 486 478 540"/><path d="M652 470 Q662 522 648 578"/>
      <path d="M262 612 Q272 660 258 714"/><path d="M566 620 Q576 668 562 722"/>
    </g>
  </g>

  <!-- desk -->
  <path d="M0 830 Q426 796 852 830 L852 1280 L0 1280 Z" fill="url(#desk)"/>
  <path d="M0 830 Q426 796 852 830 L852 850 Q426 816 0 850 Z" fill="#4b3724" opacity="0.7"/>

  <!-- lamp -->
  <g transform="translate(168 742)">
    <ellipse cx="0" cy="176" rx="150" ry="26" fill="#f0bd78" opacity="0.12" filter="url(#glow)"/>
    <path d="M-4 106 L4 106 L8 168 L-8 168 Z" fill="#2a2018"/>
    <path d="M-34 168 L34 168 L26 178 L-26 178 Z" fill="#241b13"/>
    <path d="M-46 60 L46 60 L30 104 L-30 104 Z" fill="#3a2a1c"/>
    <path d="M-46 60 L46 60 L38 44 L-38 44 Z" fill="#4b3724"/>
    <path d="M-30 96 L30 96 L20 74 L-20 74 Z" fill="#ffe2ae" opacity="0.55"/>
    <circle cx="0" cy="88" r="62" fill="url(#lamp)" opacity="0.8"/>
  </g>

  <!-- manuscript stack -->
  <g transform="translate(276 978) rotate(-3)">
    <rect x="0" y="0" width="330" height="212" rx="4" fill="#221810"/>
    <rect x="-8" y="-10" width="330" height="212" rx="4" fill="url(#cream)"/>
    <rect x="-8" y="-10" width="330" height="212" rx="4" fill="url(#paperGrain)"/>
    <rect x="-8" y="-10" width="330" height="212" rx="4" fill="none" stroke="#b99f77" stroke-width="1.2" opacity="0.55"/>
    <g stroke="#c8b294" stroke-width="1" opacity="0.6">
      <line x1="18" y1="30" x2="296" y2="30"/><line x1="18" y1="54" x2="288" y2="54"/>
      <line x1="18" y1="78" x2="300" y2="78"/><line x1="18" y1="102" x2="242" y2="102"/>
      <line x1="18" y1="126" x2="292" y2="126"/><line x1="18" y1="150" x2="276" y2="150"/>
    </g>
    <text x="18" y="14" fill="#6b4a2c" font-family="Georgia, serif" font-size="13" letter-spacing="3">MAN BEHIND ONE HIS DESIRE WOMEN</text>
    <path d="M18 176 Q120 166 220 178 Q260 182 300 174" stroke="#8f5a31" stroke-width="1.1" fill="none" opacity="0.45"/>
    <path d="M236 60 C250 70 262 74 274 70" stroke="#7a5a3a" stroke-width="1" fill="none" opacity="0.4"/>
  </g>

  <!-- fountain pen -->
  <g transform="translate(606 1064) rotate(-28)">
    <path d="M0 0 L118 0 L134 14 L118 28 L0 28 Z" fill="#1b242a"/>
    <path d="M0 0 L118 0 L118 6 L0 6 Z" fill="#3d4a52" opacity="0.7"/>
    <path d="M-26 14 L0 4 L0 24 Z" fill="#c98b55"/>
    <path d="M-26 14 L-8 10 L-8 18 Z" fill="#f0d9a6" opacity="0.7"/>
    <rect x="128" y="4" width="10" height="20" rx="3" fill="#b07a45"/>
  </g>

  <!-- cigarette and smoke -->
  <g transform="translate(660 962)">
    <rect x="0" y="0" width="86" height="8" rx="3" fill="#e9e1cf"/>
    <rect x="70" y="0" width="16" height="8" rx="3" fill="#3a2a1c"/>
    <circle cx="86" cy="4" r="4" fill="#e5a15c" opacity="0.9"/>
    <path d="M92 0 C118 -54 76 -84 108 -132 C138 -178 98 -212 122 -252" stroke="url(#smoke)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M86 4 C104 -44 66 -74 96 -118" stroke="url(#smoke)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- title -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="426" y="112" fill="#c98b55" font-size="13" letter-spacing="10" font-family="Helvetica, Arial, sans-serif">A NOVEL OF INK, HUNGER &amp; THE TRUTH</text>
    <line x1="316" y1="138" x2="536" y2="138" stroke="#c98b55" stroke-width="1" opacity="0.5"/>

    <text x="426" y="228" fill="#f4ecd9" font-size="59" letter-spacing="4" filter="url(#grain)">THE MEN BEHIND</text>
    <text x="426" y="312" fill="url(#copper)" font-size="74" font-style="italic" letter-spacing="3">A Desire Women</text>

    <text x="426" y="364" fill="#9fb6b2" font-size="15" letter-spacing="4" font-family="Helvetica, Arial, sans-serif">EVERY EMPIRE BEGINS WITH A CONFESSION</text>
  </g>

  <!-- footer -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <line x1="356" y1="1180" x2="496" y2="1180" stroke="#c98b55" stroke-width="1" opacity="0.5"/>
    <text x="426" y="1218" fill="#f1e6ce" font-size="23" letter-spacing="8">AMIM AHSAN</text>
    <text x="426" y="1248" fill="#8fa7a4" font-size="12" letter-spacing="3" font-family="Helvetica, Arial, sans-serif">writing under the pen name Amimul Ahsan</text>
    <text x="426" y="1272" fill="#657d7c" font-size="9" letter-spacing="5" font-family="Helvetica, Arial, sans-serif">A LITERARY NOVEL</text>
  </g>
</svg>
