<svg xmlns="http://www.w3.org/2000/svg" width="852" height="1280" viewBox="0 0 852 1280" role="img" aria-labelledby="title desc">
  <title id="title">Mass-Q-Rade: Book Eight — The Ghost Journalist</title>
  <desc id="desc">A violet newsprint cover: a redacted front page, a ghost-lit silhouette of a journalist in a suit with a press badge, halftone dots and a dark skyline beneath the title The Ghost Journalist by Amim Ahsan.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171233"/>
      <stop offset="0.5" stop-color="#0b0a1c"/>
      <stop offset="1" stop-color="#04040c"/>
    </linearGradient>
    <radialGradient id="violetHalo" cx="50%" cy="30%" r="62%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#6d28d9" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanHalo" cx="50%" cy="80%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0dca8"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#8f7220"/>
    </linearGradient>
    <linearGradient id="ghostGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151430"/>
      <stop offset="1" stop-color="#0a0918"/>
    </linearGradient>
    <linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0a1c" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0a1c" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ghostBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="halftone" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#c4b5fd" opacity="0.10"/>
      <circle cx="7" cy="7" r="0.8" fill="#22d3ee" opacity="0.08"/>
    </pattern>
    <pattern id="newsprint" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.5" fill="#cbd5e1" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="852" height="1280" fill="url(#night)"/>
  <rect width="852" height="1280" fill="url(#violetHalo)"/>
  <rect width="852" height="1280" fill="url(#cyanHalo)"/>
  <rect width="852" height="1280" fill="url(#halftone)"/>

  <!-- frame -->
  <rect x="0" y="0" width="852" height="8" fill="#000" opacity="0.5"/>
  <rect x="0" y="1272" width="852" height="8" fill="#000" opacity="0.6"/>

  <!-- top series mark -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="426" y="92" fill="#d4af37" font-size="25" letter-spacing="14">MASS-Q-RADE</text>
    <line x1="316" y1="114" x2="536" y2="114" stroke="#d4af37" stroke-width="1.2" opacity="0.6"/>
    <text x="426" y="150" fill="#c4b5fd" font-size="17" letter-spacing="9" opacity="0.85">BOOK EIGHT</text>
  </g>

  <!-- the front page -->
  <g transform="translate(96 188) rotate(-0.6 330 300)">
    <rect x="0" y="0" width="660" height="606" rx="6" fill="url(#paper)" stroke="#8b5cf6" stroke-width="1.6" opacity="0.95"/>
    <rect x="0" y="0" width="660" height="606" rx="6" fill="url(#newsprint)"/>

    <!-- masthead -->
    <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
      <text x="330" y="52" fill="#e2e8f0" font-size="30" letter-spacing="6" opacity="0.92" filter="url(#grain)">O DIÁRIO</text>
      <line x1="40" y1="68" x2="620" y2="68" stroke="#94a3b8" stroke-width="1" opacity="0.4"/>
      <text x="330" y="88" fill="#7f8ea8" font-size="10" letter-spacing="4">SÃO PAULO &#183; EDIÇÃO DA MADRUGADA &#183; ANO XLVIII</text>
      <line x1="40" y1="100" x2="620" y2="100" stroke="#94a3b8" stroke-width="0.8" opacity="0.25"/>
    </g>

    <!-- headline, partly redacted -->
    <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" filter="url(#grain)">
      <text x="330" y="140" fill="#e2e8f0" font-size="26" letter-spacing="2" opacity="0.9">TRANSPORT BUDGET</text>
      <text x="330" y="172" fill="#e2e8f0" font-size="26" letter-spacing="2" opacity="0.9">DISAPPEARS</text>
    </g>
    <rect x="168" y="112" width="330" height="18" fill="#05050c" opacity="0.95"/>
    <rect x="222" y="182" width="230" height="12" fill="#05050c" opacity="0.9"/>

    <!-- columns of type -->
    <g fill="#94a3b8" opacity="0.34">
      <rect x="46" y="212" width="176" height="5" rx="2"/><rect x="46" y="226" width="176" height="5" rx="2"/>
      <rect x="46" y="240" width="150" height="5" rx="2"/><rect x="46" y="254" width="176" height="5" rx="2"/>
      <rect x="46" y="268" width="128" height="5" rx="2"/><rect x="46" y="282" width="176" height="5" rx="2"/>
      <rect x="46" y="296" width="164" height="5" rx="2"/><rect x="46" y="310" width="110" height="5" rx="2"/>
      <rect x="46" y="324" width="176" height="5" rx="2"/><rect x="46" y="338" width="146" height="5" rx="2"/>
      <rect x="46" y="352" width="176" height="5" rx="2"/><rect x="46" y="366" width="98" height="5" rx="2"/>
      <rect x="46" y="380" width="176" height="5" rx="2"/><rect x="46" y="394" width="158" height="5" rx="2"/>
      <rect x="46" y="408" width="120" height="5" rx="2"/><rect x="46" y="422" width="176" height="5" rx="2"/>

      <rect x="442" y="212" width="176" height="5" rx="2"/><rect x="442" y="226" width="176" height="5" rx="2"/>
      <rect x="442" y="240" width="150" height="5" rx="2"/><rect x="442" y="254" width="176" height="5" rx="2"/>
      <rect x="442" y="268" width="128" height="5" rx="2"/><rect x="442" y="282" width="176" height="5" rx="2"/>
      <rect x="442" y="296" width="164" height="5" rx="2"/><rect x="442" y="310" width="110" height="5" rx="2"/>
      <rect x="442" y="324" width="176" height="5" rx="2"/><rect x="442" y="338" width="146" height="5" rx="2"/>
      <rect x="442" y="352" width="176" height="5" rx="2"/><rect x="442" y="366" width="98" height="5" rx="2"/>
      <rect x="442" y="380" width="176" height="5" rx="2"/><rect x="442" y="394" width="158" height="5" rx="2"/>
      <rect x="442" y="408" width="120" height="5" rx="2"/><rect x="442" y="422" width="176" height="5" rx="2"/>
    </g>

    <!-- redaction bars over the columns -->
    <g fill="#05050c">
      <rect x="46" y="238" width="92" height="9" opacity="0.92"/>
      <rect x="46" y="334" width="132" height="9" opacity="0.92"/>
      <rect x="442" y="250" width="104" height="9" opacity="0.92"/>
      <rect x="442" y="392" width="86" height="9" opacity="0.9"/>
    </g>

    <!-- the ghost silhouette -->
    <g transform="translate(330 350)">
      <ellipse cx="0" cy="-10" rx="165" ry="190" fill="#8b5cf6" opacity="0.24" filter="url(#ghostBlur)"/>

      <!-- offset ghost outline -->
      <g opacity="0.65" transform="translate(16 -8)" filter="url(#ghostBlur)">
        <ellipse cx="0" cy="-74" rx="42" ry="48" fill="none" stroke="url(#ghostGrad)" stroke-width="6"/>
        <path d="M-32 -22 C-76 -10 -104 26 -112 66 L-136 164 L136 164 L112 66 C104 26 76 -10 32 -22" fill="none" stroke="url(#ghostGrad)" stroke-width="6"/>
      </g>

      <!-- solid figure -->
      <g>
        <!-- head -->
        <ellipse cx="0" cy="-74" rx="40" ry="48" fill="#0a0a18"/>
        <!-- neck -->
        <rect x="-15" y="-34" width="30" height="26" fill="#0a0a18"/>
        <!-- shoulders and torso -->
        <path d="M-32 -22 C-74 -10 -100 26 -108 66 L-130 164 L130 164 L108 66 C100 26 74 -10 32 -22 Z" fill="#0a0a18"/>
        <!-- open shirt with tie -->
        <path d="M-30 -18 L0 6 L30 -18 L22 62 L0 92 L-22 62 Z" fill="#1b1738"/>
        <path d="M0 4 L-8 24 L0 84 L8 24 Z" fill="#8b5cf6" opacity="0.9"/>
        <!-- lapels -->
        <path d="M-30 -18 L-14 26 L-4 6 Z" fill="#131029"/>
        <path d="M30 -18 L14 26 L4 6 Z" fill="#131029"/>
        <!-- press badge -->
        <g transform="translate(-92 44) rotate(-7)">
          <rect x="0" y="0" width="34" height="24" rx="3" fill="#0f0d20" stroke="#22d3ee" stroke-width="1.6" opacity="0.95"/>
          <rect x="5" y="6" width="24" height="3" fill="#22d3ee" opacity="0.75"/>
          <rect x="5" y="14" width="15" height="3" fill="#22d3ee" opacity="0.5"/>
        </g>
        <!-- redaction band across the eyes -->
        <rect x="-48" y="-88" width="96" height="26" fill="#05050c"/>
        <rect x="-48" y="-88" width="96" height="26" fill="none" stroke="#22d3ee" stroke-width="0.9" opacity="0.4"/>
        <circle cx="52" cy="-52" r="5" fill="#22d3ee" opacity="0.9" filter="url(#softGlow)"/>
      </g>
    </g>

    <!-- stamp -->
    <g transform="rotate(-11 500 470)" opacity="0.62">
      <rect x="404" y="446" width="192" height="44" rx="4" fill="none" stroke="#d4af37" stroke-width="2" filter="url(#grain)"/>
      <text x="500" y="475" fill="#d4af37" font-size="15" font-family="Georgia, serif" letter-spacing="4" text-anchor="middle">O FANTASMA</text>
    </g>

    <!-- lower caption over the page -->
    <rect x="0" y="470" width="660" height="136" fill="url(#fadeDown)"/>
    <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
      <line x1="120" y1="522" x2="540" y2="522" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.7"/>
      <text x="330" y="556" fill="#c4b5fd" font-size="15" letter-spacing="4" opacity="0.9">THE TRUTH HAS NO FACE</text>
      <text x="330" y="584" fill="#6f7f9c" font-size="10" letter-spacing="4">TIRAGEM 380.000 &#183; IMPRESSO NA MADRUGADA</text>
    </g>
  </g>

  <!-- title -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="426" y="880" fill="#f1eefb" font-size="63" font-weight="bold" letter-spacing="4">THE GHOST</text>
    <text x="426" y="956" fill="url(#ghostGrad)" font-size="60" font-weight="bold" letter-spacing="7" filter="url(#softGlow)">JOURNALIST</text>
    <line x1="256" y1="994" x2="596" y2="994" stroke="#d4af37" stroke-width="1.3" opacity="0.6"/>
    <text x="426" y="1042" fill="#c4b5fd" font-size="17" letter-spacing="5" opacity="0.85">CARLOS MENDES &amp; THE MASS-Q-RADE NETWORK</text>
  </g>

  <!-- skyline -->
  <g opacity="0.5">
    <path d="M0 1150 L0 1120 L48 1120 L48 1088 L86 1088 L86 1128 L146 1128 L146 1096 L196 1096 L196 1132 L258 1132 L258 1104 L304 1104 L304 1140 L372 1140 L372 1092 L418 1092 L418 1132 L486 1132 L486 1068 L534 1068 L534 1128 L604 1128 L604 1100 L654 1100 L654 1136 L716 1136 L716 1096 L762 1096 L762 1132 L852 1132 L852 1150 Z" fill="#05050f"/>
    <g fill="#22d3ee" opacity="0.35">
      <rect x="60" y="1100" width="4" height="6"/><rect x="108" y="1108" width="4" height="6"/>
      <rect x="168" y="1108" width="4" height="6"/><rect x="286" y="1120" width="4" height="6"/>
      <rect x="394" y="1104" width="4" height="6"/><rect x="500" y="1096" width="4" height="6"/>
      <rect x="626" y="1112" width="4" height="6"/><rect x="738" y="1112" width="4" height="6"/>
    </g>
  </g>
  <rect y="1130" width="852" height="150" fill="url(#fadeDown)"/>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <line x1="356" y1="1170" x2="496" y2="1170" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
    <text x="426" y="1204" fill="#f2eede" font-size="22" letter-spacing="8">AMIM AHSAN</text>
    <text x="426" y="1238" fill="#9f95c6" font-size="14" letter-spacing="3">writing under the pen name Amimul Ahsan</text>
    <text x="426" y="1268" fill="#6a6394" font-size="11" letter-spacing="5">A MASS-Q-RADE SERIALIZED NOVEL</text>
  </g>
</svg>
