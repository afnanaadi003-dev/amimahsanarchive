<svg xmlns="http://www.w3.org/2000/svg" width="852" height="1280" viewBox="0 0 852 1280" role="img" aria-labelledby="title desc">
  <title id="title">The Navigator of Meluhha — a novel by Amim Ahsan</title>
  <desc id="desc">A dark sea at night: a Bronze Age reed boat with a square sail rides the swell beneath a low moon and a sky of stars, with the title The Navigator of Meluhha set above it in cream serif type.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#03070d"/>
      <stop offset="0.32" stop-color="#071726"/>
      <stop offset="0.6" stop-color="#0b2434"/>
      <stop offset="0.84" stop-color="#0d2c33"/>
      <stop offset="1" stop-color="#04090c"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="58%" r="46%">
      <stop offset="0" stop-color="#e8f2f2" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="#9fc3c9" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#3f6f7a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonCore" cx="42%" cy="38%" r="62%">
      <stop offset="0" stop-color="#fbfdf8"/>
      <stop offset="0.6" stop-color="#e4ece0"/>
      <stop offset="1" stop-color="#b9c9c0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123240"/>
      <stop offset="0.35" stop-color="#0a1f2a"/>
      <stop offset="1" stop-color="#03080b"/>
    </linearGradient>
    <linearGradient id="moonPath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf4ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#eaf4ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a12"/>
      <stop offset="1" stop-color="#0a0705"/>
    </linearGradient>
    <linearGradient id="sail" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#c9a678"/>
      <stop offset="0.55" stop-color="#9d7c52"/>
      <stop offset="1" stop-color="#5c462d"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf4e3"/>
      <stop offset="1" stop-color="#e6d4b2"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="48%" r="72%">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.58"/>
    </radialGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.6" r="0.5" fill="#ffffff" opacity="0.035"/>
      <circle cx="4.6" cy="4.2" r="0.35" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <filter id="blur24" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="blur7" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="852" height="1280" fill="url(#sky)"/>
  <rect width="852" height="1280" fill="url(#moonGlow)"/>

  <!-- stars -->
  <g fill="#f4ead7">
    <circle cx="88" cy="142" r="1.4" opacity="0.7"/>
    <circle cx="196" cy="96" r="1.1" opacity="0.5"/>
    <circle cx="286" cy="168" r="1.3" opacity="0.6"/>
    <circle cx="392" cy="112" r="1.5" opacity="0.75"/>
    <circle cx="498" cy="180" r="1.1" opacity="0.45"/>
    <circle cx="592" cy="88" r="1.4" opacity="0.6"/>
    <circle cx="668" cy="150" r="1.2" opacity="0.55"/>
    <circle cx="764" cy="196" r="1.5" opacity="0.65"/>
    <circle cx="132" cy="252" r="1.2" opacity="0.4"/>
    <circle cx="458" cy="248" r="1" opacity="0.4"/>
    <circle cx="716" cy="286" r="1.1" opacity="0.4"/>
    <circle cx="248" cy="300" r="0.9" opacity="0.3"/>
  </g>

  <!-- low moon over the water -->
  <circle cx="648" cy="742" r="190" fill="#dff0ec" opacity="0.12" filter="url(#blur24)"/>
  <circle cx="648" cy="742" r="86" fill="url(#moonCore)" opacity="0.95" filter="url(#blur7)"/>
  <circle cx="648" cy="742" r="62" fill="url(#moonCore)"/>

  <!-- distant shoreline, the five mouths of the river -->
  <g fill="#0a1e26">
    <path d="M0 800q80-22 148 4t132-2q66-26 128 2t130-4q72-24 142 6t172-6v42H0z"/>
  </g>
  <g stroke="#9fc3c9" stroke-width="1.4" opacity="0.18" fill="none">
    <path d="M40 812h96"/>
    <path d="M232 806h84"/>
    <path d="M420 816h74"/>
    <path d="M600 808h96"/>
    <path d="M760 818h52"/>
  </g>

  <!-- sea -->
  <path d="M0 826h852v454H0z" fill="url(#sea)"/>
  <path d="M0 826h852" stroke="#a8c9c9" stroke-width="1.2" opacity="0.35"/>

  <!-- moon path on the water -->
  <path d="M588 838h120l58 442H530z" fill="url(#moonPath)" opacity="0.35" filter="url(#blur7)"/>

  <!-- swell -->
  <g stroke="#8fb6b8" fill="none" stroke-linecap="round" opacity="0.22">
    <path d="M60 900q46-14 92 0t92 0" stroke-width="2"/>
    <path d="M470 946q52-16 104 0t104 0" stroke-width="2"/>
    <path d="M96 1024q58-18 116 0t116 0" stroke-width="2.4"/>
    <path d="M540 1108q50-16 100 0t100 0" stroke-width="2"/>
    <path d="M180 1176q60-16 120 0t120 0" stroke-width="1.8"/>
  </g>

  <!-- bronze age reed boat -->
  <g transform="translate(196 812)">
    <!-- mast -->
    <path d="M228 118V-118" stroke="#1d1208" stroke-width="6"/>
    <!-- sail -->
    <path d="M236-104q58 26 58 96t-58 96q-6-96-6-192z" fill="url(#sail)" opacity="0.92"/>
    <path d="M234-96q52 24 52 88t-52 88" fill="none" stroke="#f3e5ab" stroke-width="1" opacity="0.22"/>
    <g stroke="#3d2c19" stroke-width="1" opacity="0.5">
      <path d="M238-72h54M238-36h56M238 0h56M238 36h54M238 72h50"/>
    </g>
    <!-- steering oar -->
    <path d="M356 104l26 62" stroke="#1d1208" stroke-width="5"/>
    <!-- hull -->
    <path d="M28 96q104 44 214 40 66-3 104-28-40 40-108 52-124 22-210-64z" fill="url(#hull)"/>
    <path d="M28 96q104 44 214 40 66-3 104-28" fill="none" stroke="#e0b783" stroke-width="1.6" opacity="0.55"/>
    <!-- upcurled prow -->
    <path d="M28 96q-22-8-26-34-2-16 10-20-4 14 8 26 10 10 24 14z" fill="#1d1208"/>
    <!-- figure at the prow -->
    <g fill="#0a0705">
      <circle cx="120" cy="42" r="9"/>
      <path d="M113 52h14l6 34h-26z"/>
    </g>
    <!-- rowing silhouettes -->
    <g fill="#0a0705" opacity="0.9">
      <circle cx="196" cy="54" r="8"/>
      <path d="M190 63h12l5 30h-22z"/>
      <circle cx="266" cy="52" r="8"/>
      <path d="M260 61h12l5 30h-22z"/>
    </g>
    <!-- reflection -->
    <path d="M60 178q140 34 300 10" fill="none" stroke="#c9a678" stroke-width="2" opacity="0.16" filter="url(#blur7)"/>
  </g>

  <rect width="852" height="1280" fill="url(#vignette)"/>
  <rect width="852" height="1280" fill="url(#grain)"/>

  <!-- seal emblem: a clay jar of the river port -->
  <g transform="translate(426 604)" opacity="0.9">
    <path d="M-14-26h28v10c14 6 20 18 20 32 0 18-16 28-34 28S-34 34-34 16c0-14 6-26 20-32z" fill="#c9a678" opacity="0.85"/>
    <path d="M-34 8h68" stroke="#3d2c19" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="20" r="9" fill="none" stroke="#3d2c19" stroke-width="1.6" opacity="0.6"/>
    <circle cx="0" cy="-2" r="52" fill="#c9a678" opacity="0.1" filter="url(#blur7)"/>
  </g>

  <!-- frame -->
  <rect x="44" y="44" width="764" height="1192" fill="none" stroke="#e0b783" stroke-width="1.2" opacity="0.35"/>
  <rect x="56" y="56" width="740" height="1168" fill="none" stroke="#e0b783" stroke-width="0.8" opacity="0.2"/>

  <!-- typography -->
  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="426" y="176" fill="#e6b97e" font-size="19" letter-spacing="9" font-family="'Trebuchet MS', Verdana, sans-serif">A NOVEL OF THE BRONZE AGE</text>
    <text x="426" y="236" fill="#fbf4e3" font-size="26" letter-spacing="6" font-family="'Trebuchet MS', Verdana, sans-serif" opacity="0.75">AMIM AHSAN</text>

    <text x="426" y="352" fill="url(#cream)" font-size="76" letter-spacing="2">THE NAVIGATOR</text>
    <text x="426" y="438" fill="url(#cream)" font-size="76" letter-spacing="2" font-style="italic">OF MELUHHA</text>

    <path d="M356 476h140" stroke="#e0b783" stroke-width="1" opacity="0.5"/>
    <text x="426" y="518" fill="#dcc9a8" font-size="21" letter-spacing="4" font-family="'Trebuchet MS', Verdana, sans-serif" opacity="0.85">SEVEN CHAPTERS ACROSS THE SEA</text>

    <text x="426" y="1188" fill="#e8d6b6" font-size="18" letter-spacing="6" font-family="'Trebuchet MS', Verdana, sans-serif" opacity="0.75">MELUHHA · DILMUN · MAGAN</text>
  </g>
</svg>
