<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="3 Friends book cover — three friends sitting together at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241033"/>
      <stop offset="38%" stop-color="#6B2B4B"/>
      <stop offset="68%" stop-color="#C4603C"/>
      <stop offset="88%" stop-color="#E8A24E"/>
      <stop offset="100%" stop-color="#F3C87B"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A24E" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#71403F"/>
      <stop offset="100%" stop-color="#2A1720"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE4B0"/>
      <stop offset="50%" stop-color="#F5C46A"/>
      <stop offset="100%" stop-color="#FFE4B0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="300" cy="612" r="86" fill="#FFD98A" opacity="0.9" filter="url(#glow)"/>
  <circle cx="300" cy="612" r="54" fill="#FFF0C4" opacity="0.95"/>

  <!-- soft clouds -->
  <g fill="#F7C98C" opacity="0.28">
    <ellipse cx="120" cy="300" rx="120" ry="16"/>
    <ellipse cx="470" cy="230" rx="140" ry="14"/>
    <ellipse cx="330" cy="380" rx="160" ry="12"/>
  </g>

  <!-- sea / horizon -->
  <rect x="0" y="660" width="600" height="240" fill="url(#water)"/>
  <g stroke="#FFD98A" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round">
    <line x1="208" y1="700" x2="392" y2="700"/>
    <line x1="240" y1="730" x2="360" y2="730"/>
    <line x1="180" y1="762" x2="420" y2="762"/>
    <line x1="255" y1="800" x2="345" y2="800"/>
  </g>

  <!-- low land line -->
  <path d="M0 660 L120 646 L240 658 L360 644 L480 656 L600 642 L600 668 L0 668 Z" fill="#2A1720"/>

  <!-- three friends sitting, viewed from behind -->
  <g fill="#1B0F16">
    <!-- left friend -->
    <g transform="translate(150 545)">
      <circle cx="0" cy="0" r="30"/>
      <path d="M-34 96 C-34 40 -20 24 0 24 C20 24 34 40 34 96 Z"/>
      <path d="M-18 96 L-46 128 L-40 134 L-8 104 Z"/>
    </g>
    <!-- middle friend -->
    <g transform="translate(300 520)">
      <circle cx="0" cy="0" r="33"/>
      <path d="M-38 112 C-38 46 -22 27 0 27 C22 27 38 46 38 112 Z"/>
      <path d="M18 112 L48 150 L40 156 L10 122 Z"/>
    </g>
    <!-- right friend -->
    <g transform="translate(452 552)">
      <circle cx="0" cy="0" r="29"/>
      <path d="M-33 92 C-33 38 -19 23 0 23 C19 23 33 38 33 92 Z"/>
      <path d="M16 92 L44 124 L38 130 L8 100 Z"/>
    </g>
  </g>

  <!-- title block -->
  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="300" y="150" font-size="26" letter-spacing="12" fill="#F3C87B" opacity="0.85">A NOVEL</text>
    <text x="300" y="255" font-size="104" font-weight="700" fill="url(#title)" letter-spacing="6">3</text>
    <text x="300" y="345" font-size="72" font-weight="700" fill="#FFF4DC" letter-spacing="10">FRIENDS</text>
    <line x1="180" y1="392" x2="420" y2="392" stroke="#F3C87B" stroke-opacity="0.65" stroke-width="2"/>
  </g>

  <!-- author -->
  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="300" y="840" font-size="30" letter-spacing="9" fill="#FFF4DC">AMIM AHSAN</text>
    <text x="300" y="872" font-size="17" letter-spacing="6" fill="#F3C87B" opacity="0.8">THE BENGALI PHILOSOPHER</text>
  </g>
</svg>
