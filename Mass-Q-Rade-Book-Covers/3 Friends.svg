<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="3 Friends book cover — three friends before Curzon Hall at twilight">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101C17"/>
      <stop offset="42%" stop-color="#162B22"/>
      <stop offset="74%" stop-color="#265842"/>
      <stop offset="100%" stop-color="#0E1A15"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#E9C46A"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#dusk)"/>

  <!-- moon -->
  <circle cx="470" cy="150" r="42" fill="#FDE68A" opacity="0.9" filter="url(#halo)"/>
  <circle cx="486" cy="138" r="38" fill="#162B22"/>

  <!-- stars -->
  <g fill="#FDE68A" opacity="0.55">
    <circle cx="90" cy="110" r="2"/>
    <circle cx="160" cy="70" r="1.6"/>
    <circle cx="250" cy="140" r="1.4"/>
    <circle cx="330" cy="88" r="2.2"/>
    <circle cx="540" cy="240" r="1.6"/>
    <circle cx="60" cy="230" r="1.8"/>
    <circle cx="400" cy="190" r="1.4"/>
  </g>

  <!-- Curzon Hall arches -->
  <g fill="none" stroke="#EFD9A0" stroke-width="3" opacity="0.32">
    <path d="M60 560 L60 430 Q105 372 150 430 L150 560"/>
    <path d="M165 560 L165 405 Q210 344 255 405 L255 560"/>
    <path d="M270 560 L270 430 Q315 372 360 430 L360 560"/>
    <path d="M375 560 L375 400 Q420 338 465 400 L465 560"/>
    <path d="M480 560 L480 430 Q525 372 570 430 L570 560"/>
  </g>

  <!-- trinity rings -->
  <g fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.9">
    <circle cx="280" cy="360" r="52"/>
    <circle cx="336" cy="360" r="52"/>
    <circle cx="308" cy="312" r="52"/>
  </g>

  <!-- ground -->
  <path d="M0 640 L600 618 L600 900 L0 900 Z" fill="#0B1510"/>

  <!-- three friends, back view -->
  <g fill="#0B1510" stroke="#FDE68A" stroke-opacity="0.28" stroke-width="1.5">
    <g transform="translate(168 520)">
      <circle cx="0" cy="0" r="28"/>
      <path d="M-32 92 C-32 36 -18 20 0 20 C18 20 32 36 32 92 Z"/>
    </g>
    <g transform="translate(300 494)">
      <circle cx="0" cy="0" r="31"/>
      <path d="M-36 108 C-36 42 -20 24 0 24 C20 24 36 42 36 108 Z"/>
    </g>
    <g transform="translate(436 526)">
      <circle cx="0" cy="0" r="27"/>
      <path d="M-31 88 C-31 34 -17 18 0 18 C17 18 31 34 31 88 Z"/>
    </g>
  </g>

  <!-- titles -->
  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="300" y="800" font-size="24" letter-spacing="10" fill="#EFD9A0" opacity="0.85">A NOVEL BY AMIM AHSAN</text>
  </g>

  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="300" y="666" font-size="76" font-weight="700" fill="#FFF8E7" letter-spacing="10">3</text>
    <text x="300" y="738" font-size="58" font-weight="700" fill="url(#gold)" letter-spacing="14">FRIENDS</text>
    <text x="300" y="772" font-size="19" letter-spacing="5" fill="#EFD9A0" opacity="0.85">THE TWILIGHT TRINITY OF F.R. HALL</text>
  </g>
</svg>
