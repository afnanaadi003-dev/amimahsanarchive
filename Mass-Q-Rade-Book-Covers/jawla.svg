<svg xmlns="http://www.w3.org/2000/svg" width="852" height="1280" viewBox="0 0 852 1280" role="img" aria-labelledby="title desc">
  <title id="title">Jawla — a film by Amim Ahsan</title>
  <desc id="desc">A black horse and rider stand on the road below the Long Wall under a great comet with a long pale tail. The title Jawla is set in cream serif capitals above them.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.32" stop-color="#0a1018"/>
      <stop offset="0.58" stop-color="#17202a"/>
      <stop offset="0.78" stop-color="#3a3228"/>
      <stop offset="0.92" stop-color="#6b4a2c"/>
      <stop offset="1" stop-color="#191410"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="50%" cy="76%" r="58%">
      <stop offset="0" stop-color="#e2a86a" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#a86c3a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6e0" stop-opacity="0.95"/>
      <stop offset="0.28" stop-color="#f2d7a8" stop-opacity="0.4"/>
      <stop offset="0.62" stop-color="#d8a86a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tail" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e3bd" stop-opacity="0.75"/>
      <stop offset="0.4" stop-color="#d9b47c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c49a63" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf4e3"/>
      <stop offset="1" stop-color="#e2cda6"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12100d"/>
      <stop offset="0.5" stop-color="#0a0908"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1813"/>
      <stop offset="1" stop-color="#0b0a09"/>
    </linearGradient>
    <linearGradient id="wallTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8a76c" stop-opacity="0.55"/>
      <stop offset="0.42" stop-color="#c79a63" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8d6a43" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="44%" r="74%">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="852" height="1280" fill="url(#sky)"/>
  <rect width="852" height="1280" fill="url(#horizonGlow)"/>

  <!-- comet -->
  <g>
    <path d="M600 214 C 500 300, 430 420, 372 556 C 414 470, 484 348, 596 196 Z" fill="url(#tail)" filter="url(#soft)" opacity="0.85"/>
    <path d="M604 222 C 540 314, 482 420, 440 520" stroke="#f4ddb2" stroke-width="2" opacity="0.32" fill="none"/>
    <path d="M596 206 C 528 300, 470 406, 424 512" stroke="#f4ddb2" stroke-width="1" opacity="0.2" fill="none"/>
    <circle cx="612" cy="200" r="132" fill="url(#starGlow)"/>
    <circle cx="612" cy="198" r="13" fill="#fff8e8"/>
    <circle cx="612" cy="198" r="26" fill="#fff2d3" opacity="0.22" filter="url(#soft)"/>
    <path d="M612 138 v22 M612 236 v22 M552 198 h22 M650 198 h22" stroke="#fff6e2" stroke-width="1.6" opacity="0.55"/>
  </g>

  <!-- far ridge -->
  <path d="M0 646 L96 622 L188 640 L268 612 L352 638 L446 610 L540 634 L632 614 L724 636 L852 606 L852 760 L0 760 Z" fill="#0b0c10" opacity="0.9"/>

  <!-- the long wall -->
  <g>
    <!-- parapet with merlons -->
    <path d="M0 700 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h38 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h40 v 240 H0 Z" fill="url(#stone)"/>
    <path d="M0 700 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h38 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h34 v-22 h30 v22 h40" fill="none" stroke="url(#wallTop)" stroke-width="1.4"/>
    <!-- wall body shading and course lines -->
    <g stroke="#c8a15a" stroke-width="0.6" opacity="0.12">
      <path d="M0 742 H852"/>
      <path d="M0 786 H852"/>
      <path d="M0 834 H852"/>
    </g>
    <!-- old repairs, eleven patches -->
    <g fill="#c8a15a" opacity="0.1">
      <rect x="86" y="726" width="26" height="18"/>
      <rect x="168" y="768" width="22" height="20"/>
      <rect x="246" y="732" width="30" height="16"/>
      <rect x="336" y="792" width="24" height="18"/>
      <rect x="418" y="738" width="28" height="14"/>
      <rect x="496" y="776" width="20" height="22"/>
      <rect x="566" y="730" width="26" height="17"/>
      <rect x="634" y="800" width="22" height="16"/>
      <rect x="702" y="742" width="24" height="20"/>
      <rect x="762" y="784" width="26" height="14"/>
      <rect x="806" y="736" width="18" height="22"/>
    </g>
    <!-- one lit window -->
    <g>
      <rect x="424" y="798" width="12" height="16" fill="#f0b567" opacity="0.85"/>
      <rect x="420" y="794" width="20" height="24" fill="#f0b567" opacity="0.18" filter="url(#soft)"/>
    </g>
  </g>

  <!-- ground and road -->
  <rect x="0" y="876" width="852" height="404" fill="url(#ground)"/>
  <path d="M0 906 L180 892 L360 902 L540 888 L720 900 L852 886 L852 940 L700 952 L520 942 L350 954 L170 944 L0 958 Z" fill="#0d0b09" opacity="0.9"/>

  <!-- horse and rider -->
  <g fill="#050506">
    <!-- horse body -->
    <path d="M196 848 c-8-34 4-58 26-66 c18-7 44-9 66-4 c20 4 30 18 34 40 c4 22-2 42-10 58 l-6 22 h-12 l4-24 c-14 4-30 5-46 3 l-2 21 h-12 l2-24 c-16-3-30-10-38-20 Z"/>
    <!-- neck and head -->
    <path d="M300 786 c10-16 20-30 38-38 c16-7 30-4 38 6 c6 8 6 18 2 26 l-10 6 c4 6 4 12-2 16 c-8 6-18 4-24-2 l-8 2 c-6 16-16 28-30 34 c-8 4-16-2-14-12 c2-10 6-22 10-38 Z"/>
    <!-- ears -->
    <path d="M346 748 l6-18 l8 14 Z"/>
    <path d="M362 748 l10-16 l4 16 Z"/>
    <!-- legs -->
    <g>
      <path d="M212 852 l16 6 l6 78 h-14 Z"/>
      <path d="M246 858 l16 4 l4 74 h-14 Z"/>
      <path d="M292 858 l16-2 l8 74 h-14 Z"/>
      <path d="M318 850 l16 2 l2 80 h-14 Z"/>
    </g>
    <!-- hooves -->
    <g>
      <rect x="218" y="930" width="18" height="10" rx="3"/>
      <rect x="250" y="930" width="18" height="10" rx="3"/>
      <rect x="298" y="928" width="18" height="10" rx="3"/>
      <rect x="320" y="928" width="18" height="10" rx="3"/>
    </g>
    <!-- tail -->
    <path d="M196 806 c-22 6-38 26-46 54 c-4 14-2 26 4 34 c10-26 22-46 44-58 Z"/>
    <!-- mane -->
    <path d="M312 800 c-6-18-2-36 10-48 c4 14 4 26 0 38 Z"/>
    <!-- rider -->
    <g>
      <path d="M246 786 c-4-18 4-34 16-40 c10-5 22-2 26 8 c4 10 0 22-8 28 l-4 26 h-24 Z"/>
      <circle cx="266" cy="724" r="16"/>
      <path d="M256 704 c2-10 12-16 22-12 l6 4 c-4-8-16-12-26-6 c-10 6-12 18-6 26 Z" opacity="0.9"/>
      <path d="M262 738 l-18 18 c-4 4-2 10 4 10 c8 0 16-6 22-14 Z"/>
      <path d="M276 748 l18 10 c6 4 4 12-4 12 c-10 0-18-6-22-14 Z"/>
    </g>
  </g>

  <!-- ground mist -->
  <ellipse cx="470" cy="946" rx="470" ry="26" fill="#c8a15a" opacity="0.07" filter="url(#soft)"/>

  <!-- vignette + grain -->
  <rect width="852" height="1280" fill="url(#vignette)"/>
  <rect width="852" height="1280" filter="url(#grain)" opacity="0.055"/>

  <!-- frame -->
  <rect x="44" y="44" width="764" height="1192" fill="none" stroke="#e0b783" stroke-width="1.2" opacity="0.35"/>
  <rect x="56" y="56" width="740" height="1168" fill="none" stroke="#e0b783" stroke-width="0.8" opacity="0.18"/>

  <!-- typography -->
  <g text-anchor="middle">
    <text x="426" y="150" fill="#e6b97e" font-size="15" letter-spacing="9" font-family="'Trebuchet MS', Verdana, sans-serif">A FILM BY AMIM AHSAN</text>

    <text x="426" y="330" fill="url(#cream)" font-size="118" letter-spacing="14" font-family="Georgia, 'Times New Roman', serif">JAWLA</text>

    <path d="M336 372 h180" stroke="#e0b783" stroke-width="1" opacity="0.5"/>
    <text x="426" y="412" fill="#dcc9a8" font-size="15" letter-spacing="4.5" font-family="'Trebuchet MS', Verdana, sans-serif" opacity="0.9">THE WALL HELD. THE STAR DID NOT BLINK.</text>

    <text x="426" y="1132" fill="#f0dcbb" font-size="17" letter-spacing="6" font-family="'Trebuchet MS', Verdana, sans-serif" opacity="0.8">TWENTY-SEVEN CHAPTERS</text>
    <text x="426" y="1166" fill="#c8a15a" font-size="12.5" letter-spacing="5" font-family="'Trebuchet MS', Verdana, sans-serif" opacity="0.85">A SCREENPLAY · INT. / EXT.</text>
    <text x="426" y="1212" fill="#8f8674" font-size="11" letter-spacing="4" font-family="'Trebuchet MS', Verdana, sans-serif">SUR · THE RIVER DHARA · THE NINTH YEAR</text>
  </g>
</svg>
