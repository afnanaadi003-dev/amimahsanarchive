<svg xmlns="http://www.w3.org/2000/svg" width="852" height="1280" viewBox="0 0 852 1280" role="img" aria-labelledby="title desc">
  <title id="title">Baharam — a film by Amim Ahsan</title>
  <desc id="desc">A lone rider on a straight imperial road leading toward a seven-arched stone bridge standing in flood water, under a pale dawn sky. The title Baharam is set in cream serif capitals above the horizon.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.35" stop-color="#0b1118"/>
      <stop offset="0.62" stop-color="#182028"/>
      <stop offset="0.82" stop-color="#3b3730"/>
      <stop offset="0.94" stop-color="#7a6446"/>
      <stop offset="1" stop-color="#2a2118"/>
    </linearGradient>
    <radialGradient id="dawn" cx="50%" cy="74%" r="62%">
      <stop offset="0" stop-color="#e8c191" stop-opacity="0.38"/>
      <stop offset="0.4" stop-color="#b08350" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e9aa1" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#4d5a61" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#141a1e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f675c"/>
      <stop offset="0.5" stop-color="#4a443c"/>
      <stop offset="1" stop-color="#221f1a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a891"/>
      <stop offset="0.45" stop-color="#5f574c"/>
      <stop offset="1" stop-color="#1d1a17"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="852" height="1280" fill="url(#sky)"/>
  <rect width="852" height="1280" fill="url(#dawn)"/>

  <!-- stars -->
  <g fill="#f3ecdc" opacity="0.75">
    <circle cx="96" cy="162" r="1.5"/>
    <circle cx="188" cy="242" r="1"/>
    <circle cx="286" cy="128" r="1.2"/>
    <circle cx="372" cy="206" r="0.9"/>
    <circle cx="522" cy="146" r="1.4"/>
    <circle cx="614" cy="232" r="1"/>
    <circle cx="706" cy="164" r="1.6"/>
    <circle cx="764" cy="286" r="1"/>
    <circle cx="142" cy="332" r="1"/>
    <circle cx="438" cy="318" r="1.1"/>
    <circle cx="664" cy="356" r="0.9"/>
    <circle cx="246" cy="396" r="0.8"/>
  </g>

  <!-- distant ridge -->
  <path d="M0 742 L96 726 L168 736 L246 714 L318 730 L404 708 L486 726 L560 710 L640 730 L724 712 L792 726 L852 716 L852 812 L0 812 Z"
        fill="#0d1216" opacity="0.92"/>
  <path d="M0 762 L132 750 L252 760 L368 748 L496 762 L624 748 L744 760 L852 750 L852 816 L0 816 Z"
        fill="#161b1e"/>

  <!-- dawn haze behind bridge -->
  <ellipse cx="426" cy="792" rx="330" ry="70" fill="#c9a272" opacity="0.22" filter="url(#soft)"/>

  <!-- flood water -->
  <rect x="0" y="792" width="852" height="118" fill="url(#water)"/>
  <g stroke="#cfd6d8" stroke-opacity="0.22" stroke-width="1.2">
    <line x1="28" y1="826" x2="212" y2="824"/>
    <line x1="262" y1="842" x2="430" y2="840"/>
    <line x1="470" y1="820" x2="640" y2="822"/>
    <line x1="676" y1="846" x2="822" y2="844"/>
    <line x1="120" y1="870" x2="300" y2="868"/>
    <line x1="356" y1="886" x2="520" y2="884"/>
    <line x1="556" y1="872" x2="740" y2="874"/>
  </g>

  <!-- bridge: seven arches -->
  <g>
    <path d="M40 792 L40 742 L812 742 L812 792 Z" fill="url(#stone)"/>
    <path d="M40 742 Q426 716 812 742" fill="none" stroke="#c3b49c" stroke-opacity="0.5" stroke-width="2"/>
    <g fill="#0a0d10">
      <path d="M78 792 L78 770 A26 26 0 0 1 130 770 L130 792 Z"/>
      <path d="M180 792 L180 768 A28 28 0 0 1 236 768 L236 792 Z"/>
      <path d="M286 792 L286 766 A30 30 0 0 1 346 766 L346 792 Z"/>
      <path d="M396 792 L396 768 A30 30 0 0 1 456 768 L456 792 Z"/>
      <path d="M506 792 L506 766 A30 30 0 0 1 566 766 L566 792 Z"/>
      <path d="M616 792 L616 768 A28 28 0 0 1 672 768 L672 792 Z"/>
      <path d="M722 792 L722 770 A26 26 0 0 1 774 770 L774 792 Z"/>
    </g>
    <!-- parapet marks -->
    <g stroke="#e2d6c0" stroke-opacity="0.16" stroke-width="1.4">
      <line x1="60" y1="752" x2="792" y2="752"/>
      <line x1="60" y1="764" x2="792" y2="764"/>
    </g>
    <!-- waterline on stone -->
    <path d="M40 786 Q426 774 812 786 L812 792 L40 792 Z" fill="#8fa0a8" opacity="0.22"/>
  </g>

  <!-- river source beyond bridge -->
  <rect x="0" y="812" width="852" height="8" fill="#0b0e11" opacity="0.5"/>

  <!-- the road -->
  <path d="M426 792 L470 1280 L382 1280 Z" fill="url(#road)"/>
  <g stroke="#cbbfa9" stroke-opacity="0.14" stroke-width="2">
    <line x1="426" y1="800" x2="452" y2="1120"/>
    <line x1="426" y1="800" x2="400" y2="1120"/>
  </g>

  <!-- milestone -->
  <g>
    <path d="M236 1188 L262 1188 L258 1140 L240 1140 Z" fill="#8d8578"/>
    <path d="M240 1140 L258 1140 L254 1146 L244 1146 Z" fill="#c4bba8" opacity="0.7"/>
    <path d="M236 1188 L262 1188 L260 1194 L238 1194 Z" fill="#3a352d"/>
  </g>

  <!-- rider and horse -->
  <g fill="#07090b">
    <path d="M470 1042 C468 1014 452 1004 444 992 C440 986 444 980 450 980 C456 980 458 986 458 990 C462 998 472 1002 480 1006 L492 1004 C496 1002 500 1004 500 1008 C500 1012 496 1014 492 1014 L486 1030 L492 1056 L486 1058 L478 1034 L468 1060 L460 1058 L468 1042 Z"/>
    <path d="M444 1032 C438 1034 436 1040 438 1046 L444 1044 Z"/>
    <path d="M450 982 C454 972 466 968 474 972 L470 980 C464 978 458 980 456 986 Z"/>
  </g>

  <!-- seal, broken, resting on the road -->
  <g transform="translate(560 1124) rotate(-8)">
    <circle r="30" fill="#7d2020" opacity="0.85"/>
    <circle r="22" fill="none" stroke="#e7d9bd" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle r="13" fill="none" stroke="#e7d9bd" stroke-opacity="0.22" stroke-width="1"/>
    <path d="M-30 -4 L-6 2 L-2 30" fill="none" stroke="#0a0a0c" stroke-width="3"/>
  </g>

  <!-- typography -->
  <g text-anchor="middle" fill="#f1e6cf">
    <text x="426" y="196" font-family="Cormorant Garamond, Georgia, serif" font-size="26" letter-spacing="12" fill-opacity="0.72">A FILM BY AMIM AHSAN</text>
    <text x="426" y="330" font-family="Cormorant Garamond, Georgia, serif" font-size="104" letter-spacing="14">BAHARAM</text>
    <text x="426" y="386" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="7" fill-opacity="0.7">ONE ORDER · ONE NIGHT · ONE ROAD</text>
    <line x1="286" y1="240" x2="566" y2="240" stroke="#c8a15a" stroke-opacity="0.45" stroke-width="1"/>
    <rect x="410" y="232" width="32" height="16" fill="none" stroke="#c8a15a" stroke-opacity="0.6"/>
  </g>

  <g text-anchor="middle" fill="#e6d9c1">
    <text x="426" y="1204" font-family="Cormorant Garamond, Georgia, serif" font-size="17" letter-spacing="3.2" fill-opacity="0.8">A KINGDOM THAT COULD NOT AFFORD THE TRUTH</text>
  </g>

  <rect width="852" height="1280" fill="url(#vignette)"/>
  <rect width="852" height="1280" filter="url(#grain)" opacity="0.5"/>
</svg>
