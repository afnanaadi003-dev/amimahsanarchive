<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
  <title id="t">Chapter 35 — THE LONG WAR</title>
  <desc id="d">Illustrated title slide for chapter 35 of Sykes–Picot, Act IV.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3d2d18"/><stop offset="1" stop-color="#150e08"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="27%" r="66%">
      <stop offset="0" stop-color="#eabf76" stop-opacity="0.2"/><stop offset="1" stop-color="#eabf76" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050403" stop-opacity="0.94"/>
      <stop offset="0.44" stop-color="#050403" stop-opacity="0.66"/>
      <stop offset="0.72" stop-color="#050403" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#050403" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topscrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050403" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#050403" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#050403" stop-opacity="0"/>
