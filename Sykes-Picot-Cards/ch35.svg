    <path d="M40 332 l-9 -11 M40 332 l9 -11 M120 328 l-9 -11 M120 328 l9 -11 M200 336 l-9 -11 M200 336 l9 -11 M280 332 l-9 -11 M280 332 l9 -11"/>
