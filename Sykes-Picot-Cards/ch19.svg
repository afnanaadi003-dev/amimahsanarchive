    <rect x="446" y="108" width="26" height="40" transform="rotate(-2 459 128)"/><rect x="486" y="108" width="26" height="40" transform="rotate(0 499 128)"/><rect x="526" y="108" width="26" height="40" transform="rotate(2 539 128)"/>
