<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
  <title id="t">Chapter 2 — THE SHARIF</title>
  <desc id="d">Illustrated title slide for chapter 2 of Sykes–Picot, Act I.</desc>
  <defs>
