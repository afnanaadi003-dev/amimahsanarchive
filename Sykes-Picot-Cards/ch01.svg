      <stop offset="1" stop-color="#eabf76" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#ffffff" opacity="0.035"/>
    </pattern>
