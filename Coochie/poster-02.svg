<svg xmlns="http://www.w3.org/2000/svg" width="852" height="1280" viewBox="0 0 852 1280" role="img" aria-labelledby="t d">
  <title id="t">The Light Is Here — series two of Coochie</title>
  <desc id="d">A dark hardware store at night: a single warm bulb hangs over a wall of labelled drawers, and a cone of light falls to the floor.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1116"/>
      <stop offset="0.55" stop-color="#131a21"/>
      <stop offset="1" stop-color="#080a0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd79a" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#f0a95c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e08a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf95" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffcf95" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.65" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.68"/>
    </radialGradient>
  </defs>

  <rect width="852" height="1280" fill="url(#back)"/>

  <!-- drawer wall -->
  <g fill="#161b21" stroke="#2a323a" stroke-width="2">
    <g id="row1">
      <rect x="46" y="828" width="92" height="52"/><rect x="146" y="828" width="92" height="52"/>
      <rect x="246" y="828" width="92" height="52"/><rect x="346" y="828" width="92" height="52"/>
      <rect x="446" y="828" width="92" height="52"/><rect x="546" y="828" width="92" height="52"/>
      <rect x="646" y="828" width="92" height="52"/><rect x="746" y="828" width="60" height="52"/>
    </g>
    <g>
      <rect x="46" y="888" width="92" height="52"/><rect x="146" y="888" width="92" height="52"/>
      <rect x="246" y="888" width="92" height="52"/><rect x="346" y="888" width="92" height="52"/>
      <rect x="446" y="888" width="92" height="52"/><rect x="546" y="888" width="92" height="52"/>
      <rect x="646" y="888" width="92" height="52"/><rect x="746" y="888" width="60" height="52"/>
    </g>
    <g>
      <rect x="46" y="948" width="92" height="52"/><rect x="146" y="948" width="92" height="52"/>
      <rect x="246" y="948" width="92" height="52"/><rect x="346" y="948" width="92" height="52"/>
      <rect x="446" y="948" width="92" height="52"/><rect x="546" y="948" width="92" height="52"/>
      <rect x="646" y="948" width="92" height="52"/><rect x="746" y="948" width="60" height="52"/>
    </g>
  </g>
  <!-- drawer pulls -->
  <g fill="#3d464f">
    <rect x="84" y="852" width="16" height="4" rx="2"/><rect x="184" y="852" width="16" height="4" rx="2"/>
    <rect x="284" y="852" width="16" height="4" rx="2"/><rect x="384" y="852" width="16" height="4" rx="2"/>
    <rect x="484" y="852" width="16" height="4" rx="2"/><rect x="584" y="852" width="16" height="4" rx="2"/>
    <rect x="684" y="852" width="16" height="4" rx="2"/><rect x="768" y="852" width="16" height="4" rx="2"/>
    <rect x="84" y="912" width="16" height="4" rx="2"/><rect x="184" y="912" width="16" height="4" rx="2"/>
    <rect x="284" y="912" width="16" height="4" rx="2"/><rect x="384" y="912" width="16" height="4" rx="2"/>
    <rect x="484" y="912" width="16" height="4" rx="2"/><rect x="584" y="912" width="16" height="4" rx="2"/>
    <rect x="684" y="912" width="16" height="4" rx="2"/><rect x="768" y="912" width="16" height="4" rx="2"/>
  </g>

  <!-- floor -->
  <rect x="0" y="1006" width="852" height="274" fill="#0b0e12"/>
  <path d="M0 1006 H852" stroke="#232b33" stroke-width="3"/>

  <!-- cord + bulb -->
  <line x1="426" y1="0" x2="426" y2="596" stroke="#1b1f24" stroke-width="6"/>
  <circle cx="426" cy="756" r="210" fill="url(#glow)"/>
  <path d="M356 620 L496 620 L560 1006 L292 1006 Z" fill="url(#cone)"/>
  <rect x="404" y="596" width="44" height="26" rx="4" fill="#2b3138"/>
  <path d="M406 622 q20 74 20 96 q0 34 -20 34 q-20 0 -20 -34 q0 -22 20 -96" fill="#ffd696" opacity="0.95"/>
  <line x1="426" y1="640" x2="426" y2="726" stroke="#c8863a" stroke-width="4"/>

  <!-- title -->
  <g text-anchor="middle">
    <text x="426" y="150" font-family="Helvetica, Arial, sans-serif" font-size="20" letter-spacing="10" fill="#e8dcc7" fill-opacity="0.75">A FILM BY AMIM AHSAN</text>
    <text x="426" y="300" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="92" fill="#f6ecda">The Light</text>
    <text x="426" y="382" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="92" fill="#f6ecda">Is Here</text>
    <line x1="336" y1="424" x2="516" y2="424" stroke="#f0bd7c" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="426" y="466" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="6" fill="#f2e6d2" fill-opacity="0.85">SERIES TWO OF TWENTY-FOUR</text>
    <text x="426" y="502" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4" fill="#f2e6d2" fill-opacity="0.55">30 CHAPTERS · 24 SERIES</text>
    <text x="426" y="1170" font-family="Georgia, serif" font-style="italic" font-size="21" fill="#f2e6d2" fill-opacity="0.8">Knowing where the light is does not pay the rent.</text>
  </g>

  <rect width="852" height="1280" fill="url(#vig)"/>
</svg>
