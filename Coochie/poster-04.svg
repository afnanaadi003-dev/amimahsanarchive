<svg xmlns="http://www.w3.org/2000/svg" width="852" height="1280" viewBox="0 0 852 1280" role="img" aria-labelledby="t d">
  <title id="t">Dual-Purpose Branding — series four of Coochie</title>
  <desc id="d">A cream staff name badge reading REYES, DOLORES M., with a strip of gold vinyl stuck over the first name that says CIVIC. A price tag hangs from the corner.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111820"/>
      <stop offset="0.55" stop-color="#16202a"/>
      <stop offset="1" stop-color="#080c10"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f3ead6"/>
      <stop offset="0.55" stop-color="#e6dbc2"/>
      <stop offset="1" stop-color="#cfc3a8"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7c078"/>
      <stop offset="1" stop-color="#c9a256"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="80%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#000" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.78"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="852" height="1280" fill="url(#field)"/>

  <!-- title -->
  <g text-anchor="middle">
    <text x="426" y="132" font-family="Helvetica, Arial, sans-serif" font-size="18" letter-spacing="9" fill="#e8dcc7" fill-opacity="0.7">A FILM BY AMIM AHSAN</text>
    <text x="426" y="258" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="82" fill="#f6ecda">Dual-Purpose</text>
    <text x="426" y="342" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="82" fill="#f6ecda">Branding</text>
    <line x1="352" y1="384" x2="500" y2="384" stroke="#f0bd7c" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="426" y="420" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="6" fill="#f2e6d2" fill-opacity="0.8">SERIES FOUR OF TWENTY-FOUR</text>
    <text x="426" y="450" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#f2e6d2" fill-opacity="0.45">30 CHAPTERS · 24 SERIES</text>
  </g>

  <!-- badge shadow -->
  <ellipse cx="426" cy="828" rx="250" ry="26" fill="#000" opacity="0.55" filter="url(#soft)"/>

  <!-- name badge -->
  <g transform="rotate(-3 426 640)">
    <rect x="176" y="500" width="500" height="300" rx="18" fill="url(#badge)"/>
    <rect x="176" y="500" width="500" height="300" rx="18" fill="none" stroke="#8d8064" stroke-width="2" opacity="0.55"/>
    <!-- clip slot -->
    <rect x="376" y="518" width="100" height="14" rx="7" fill="#16202a" opacity="0.45"/>
    <!-- monogram -->
    <circle cx="600" cy="590" r="30" fill="none" stroke="#3b3226" stroke-width="2" opacity="0.55"/>
    <text x="600" y="602" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#3b3226" opacity="0.8">R</text>
    <!-- surname -->
    <text x="216" y="604" font-family="Georgia, 'Times New Roman', serif" font-size="66" letter-spacing="2" fill="#1c242c">REYES</text>
    <!-- given name, struck out -->
    <text x="216" y="668" font-family="Helvetica, Arial, sans-serif" font-size="30" letter-spacing="3" fill="#3f4a54">DOLORES M.</text>
    <!-- vinyl strip -->
    <g transform="rotate(-1.5 216 664)">
      <rect x="204" y="638" width="286" height="54" rx="3" fill="url(#strip)"/>
      <rect x="204" y="638" width="286" height="54" rx="3" fill="none" stroke="#8a6c2c" stroke-width="1.5" opacity="0.7"/>
      <text x="222" y="676" font-family="Helvetica, Arial, sans-serif" font-size="33" font-weight="bold" letter-spacing="6" fill="#1b1408">CIVIC</text>
      <path d="M212 642 L216 688" stroke="#fff" stroke-opacity="0.3" stroke-width="5"/>
    </g>
    <!-- barcode -->
    <g fill="#1c242c" opacity="0.85">
      <rect x="216" y="770" width="3" height="44"/><rect x="222" y="770" width="2" height="44"/>
      <rect x="228" y="770" width="5" height="44"/><rect x="237" y="770" width="2" height="44"/>
      <rect x="243" y="770" width="3" height="44"/><rect x="250" y="770" width="6" height="44"/>
      <rect x="260" y="770" width="2" height="44"/><rect x="266" y="770" width="4" height="44"/>
      <rect x="274" y="770" width="3" height="44"/><rect x="281" y="770" width="2" height="44"/>
      <rect x="287" y="770" width="5" height="44"/><rect x="296" y="770" width="3" height="44"/>
      <rect x="303" y="770" width="2" height="44"/><rect x="309" y="770" width="6" height="44"/>
      <rect x="319" y="770" width="3" height="44"/><rect x="326" y="770" width="2" height="44"/>
      <rect x="332" y="770" width="4" height="44"/><rect x="340" y="770" width="2" height="44"/>
      <rect x="346" y="770" width="5" height="44"/><rect x="355" y="770" width="3" height="44"/>
      <rect x="362" y="770" width="2" height="44"/><rect x="368" y="770" width="6" height="44"/>
      <rect x="378" y="770" width="3" height="44"/><rect x="385" y="770" width="2" height="44"/>
      <rect x="391" y="770" width="4" height="44"/><rect x="399" y="770" width="5" height="44"/>
      <rect x="408" y="770" width="2" height="44"/><rect x="414" y="770" width="3" height="44"/>
    </g>
  </g>

  <!-- price tag -->
  <g transform="rotate(15 650 790)">
    <path d="M612 742 L700 726 L716 814 L628 830 Z" fill="#efe4cc" stroke="#8d8064" stroke-width="2"/>
    <circle cx="628" cy="764" r="7" fill="#16202a"/>
    <text x="668" y="792" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1c242c">435</text>
  </g>

  <!-- tagline -->
  <g text-anchor="middle">
    <text x="426" y="960" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#f2e6d2" fill-opacity="0.82">A brand doesn't carry a middle name.</text>
    <text x="426" y="1002" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#f2e6d2" fill-opacity="0.42">A COOCHIE SERIES · WRITTEN &amp; DIRECTED BY AMIM AHSAN</text>
  </g>

  <rect width="852" height="1280" fill="url(#vig)"/>
</svg>
