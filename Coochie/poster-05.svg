<svg xmlns="http://www.w3.org/2000/svg" width="852" height="1280" viewBox="0 0 852 1280" role="img" aria-labelledby="t d">
  <title id="t">The Loaner — series five of Coochie</title>
  <desc id="d">A cinema camera in warm rim light, serial plate reading 0447, with eleven numbered rental tags lined up beneath it.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1015"/>
      <stop offset="0.5" stop-color="#151b22"/>
      <stop offset="1" stop-color="#070a0d"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#2b343d"/>
      <stop offset="0.5" stop-color="#1b2229"/>
      <stop offset="1" stop-color="#11161b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0c082" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#f0c082" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f0c082" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7dcc4"/>
      <stop offset="1" stop-color="#bfb295"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd79a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffd79a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="80%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.8"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="852" height="1280" fill="url(#field)"/>
  <ellipse cx="426" cy="640" rx="330" ry="240" fill="url(#glow)"/>

  <!-- title -->
  <g text-anchor="middle">
    <text x="426" y="130" font-family="Helvetica, Arial, sans-serif" font-size="18" letter-spacing="9" fill="#e8dcc7" fill-opacity="0.7">A FILM BY AMIM AHSAN</text>
    <text x="426" y="252" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="82" fill="#f6ecda">The</text>
    <text x="426" y="336" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="82" fill="#f6ecda">Loaner</text>
    <line x1="360" y1="376" x2="492" y2="376" stroke="#f0bd7c" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="426" y="412" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="6" fill="#f2e6d2" fill-opacity="0.8">SERIES FIVE OF TWENTY-FOUR</text>
    <text x="426" y="442" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#f2e6d2" fill-opacity="0.45">31 CHAPTERS · 24 SERIES</text>
  </g>

  <!-- shadow under camera -->
  <ellipse cx="440" cy="806" rx="250" ry="24" fill="#000" opacity="0.6" filter="url(#soft)"/>

  <!-- camera, side profile -->
  <g>
    <!-- top handle -->
    <rect x="338" y="512" width="212" height="20" rx="8" fill="#242c34" stroke="#3d4750" stroke-width="2"/>
    <rect x="360" y="532" width="16" height="20" fill="#242c34"/>
    <rect x="512" y="532" width="16" height="20" fill="#242c34"/>
    <!-- body -->
    <rect x="272" y="548" width="356" height="184" rx="16" fill="url(#body)" stroke="#414c56" stroke-width="2.5"/>
    <!-- vents -->
    <g stroke="#48535e" stroke-width="3" stroke-linecap="round">
      <line x1="522" y1="576" x2="588" y2="576"/>
      <line x1="522" y1="588" x2="588" y2="588"/>
      <line x1="522" y1="600" x2="588" y2="600"/>
    </g>
    <!-- lens assembly, pointing left -->
    <rect x="236" y="590" width="70" height="104" rx="6" fill="#232b33" stroke="#414c56" stroke-width="2.5"/>
    <rect x="222" y="586" width="26" height="112" rx="5" fill="#1b222a" stroke="#4a555f" stroke-width="2.5"/>
    <circle cx="212" cy="642" r="54" fill="#0d1216" stroke="#4a555f" stroke-width="3"/>
    <circle cx="212" cy="642" r="36" fill="#141b21" stroke="#38424b" stroke-width="2"/>
    <circle cx="212" cy="642" r="18" fill="#0a0e12" stroke="#53606b" stroke-width="2"/>
    <circle cx="203" cy="633" r="6" fill="#93a6b4" opacity="0.4"/>
    <!-- flip-out monitor -->
    <rect x="462" y="614" width="118" height="74" rx="5" fill="#26404f" stroke="#4c5a66" stroke-width="2"/>
    <rect x="470" y="622" width="102" height="58" rx="3" fill="#1a2a34"/>
    <line x1="470" y1="651" x2="572" y2="651" stroke="#3f6274" stroke-width="1.5" opacity="0.7"/>
    <!-- serial plate -->
    <g>
      <rect x="300" y="686" width="134" height="28" rx="3" fill="url(#plate)"/>
      <rect x="300" y="686" width="134" height="28" rx="3" fill="none" stroke="#8d8064" stroke-width="1.5"/>
      <text x="314" y="706" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#3c3527">S/N</text>
      <text x="366" y="707" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="3" fill="#241f15">0447</text>
    </g>
    <!-- record light -->
    <path d="M292 552 H360" stroke="#f0c082" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M272 588 V692" stroke="#f0c082" stroke-opacity="0.2" stroke-width="2" stroke-linecap="round"/>
    <rect x="272" y="548" width="356" height="184" rx="16" fill="none" stroke="#f0c082" stroke-opacity="0.12" stroke-width="1.5"/>
  </g>

  <!-- eleven rental tags -->
  <g>
    <line x1="118" y1="866" x2="734" y2="866" stroke="#2c353d" stroke-width="2"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1" text-anchor="middle">
      <g fill="#1b2128" stroke="#3e4953" stroke-width="1.5">
        <rect x="96" y="878" width="52" height="26" rx="4"/>
        <rect x="154" y="878" width="52" height="26" rx="4"/>
        <rect x="212" y="878" width="52" height="26" rx="4"/>
        <rect x="270" y="878" width="52" height="26" rx="4"/>
        <rect x="328" y="878" width="52" height="26" rx="4"/>
        <rect x="386" y="878" width="52" height="26" rx="4"/>
        <rect x="444" y="878" width="52" height="26" rx="4"/>
        <rect x="502" y="878" width="52" height="26" rx="4"/>
        <rect x="560" y="878" width="52" height="26" rx="4"/>
        <rect x="618" y="878" width="52" height="26" rx="4"/>
        <rect x="676" y="878" width="52" height="26" rx="4"/>
      </g>
      <g fill="#9fb0bd">
        <text x="122" y="896">01</text><text x="180" y="896">02</text><text x="238" y="896">03</text>
        <text x="296" y="896">04</text><text x="354" y="896">05</text><text x="412" y="896">06</text>
        <text x="470" y="896">07</text><text x="528" y="896">08</text><text x="586" y="896">09</text>
        <text x="644" y="896">10</text><text x="702" y="896">11</text>
      </g>
      <g stroke="#3e4953" stroke-width="1.5">
        <line x1="106" y1="866" x2="122" y2="878"/><line x1="164" y1="866" x2="180" y2="878"/>
        <line x1="222" y1="866" x2="238" y2="878"/><line x1="280" y1="866" x2="296" y2="878"/>
        <line x1="338" y1="866" x2="354" y2="878"/><line x1="396" y1="866" x2="412" y2="878"/>
        <line x1="454" y1="866" x2="470" y2="878"/><line x1="512" y1="866" x2="528" y2="878"/>
        <line x1="570" y1="866" x2="586" y2="878"/><line x1="628" y1="866" x2="644" y2="878"/>
        <line x1="686" y1="866" x2="702" y2="878"/>
      </g>
    </g>
  </g>

  <!-- tagline -->
  <g text-anchor="middle">
    <text x="426" y="1000" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#f2e6d2" fill-opacity="0.82">Eleven hands. One county. One camera.</text>
    <text x="426" y="1042" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#f2e6d2" fill-opacity="0.42">A COOCHIE SERIES · WRITTEN &amp; DIRECTED BY AMIM AHSAN</text>
  </g>

  <rect width="852" height="1280" fill="url(#vig)"/>
</svg>
