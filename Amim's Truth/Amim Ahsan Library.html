<div id="dream-directory">
<style>
#dream-directory {
  --text:#f7f4ff;
  --muted:#b6b3d2;
  --purple:#a78bfa;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse at 15% 0%,#49347c 0,transparent 40%),
    radial-gradient(ellipse at 90% 25%,#30265e 0,transparent 38%),
    linear-gradient(145deg,#080b1a,#11112b 55%,#090b19);
  padding:clamp(18px,4vw,42px);
  border-radius:24px;
  overflow:hidden;
  position:relative;
  isolation:isolate;
}
#dream-directory * {box-sizing:border-box}
#dream-directory .dd-hero {
  text-align:center;
  padding:28px 0 34px;
}
#dream-directory .dd-label {
  display:inline-block;
  border:1px solid #c4b5fd55;
  background:#c4b5fd12;
  color:#d9ccff;
  padding:8px 15px;
  border-radius:30px;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
}
#dream-directory .dd-hero h2 {
  color:#fff;
  font-size:clamp(30px,6vw,54px);
  letter-spacing:-1.8px;
  line-height:1.13;
  margin:23px 0 15px;
  font-weight:800;
}
#dream-directory .dd-gradient {
  background:linear-gradient(100deg,#e9d5ff,#a5b4fc,#f0abfc);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
#dream-directory .dd-hero p {
  color:var(--muted);
  font-size:15px;
  line-height:1.8;
  max-width:540px;
  margin:0 auto;
}
#dream-directory .dd-search-wrap {
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(130px,190px);
  gap:12px;
  max-width:750px;
  margin:0 auto 16px;
}
#dream-directory .dd-search-wrap input,
#dream-directory .dd-search-wrap select {
  width:100%;
  min-width:0;
  border:1px solid #ffffff1c;
  border-radius:13px;
  padding:15px 16px;
  background:#ffffff09;
  color:#fff;
  outline:none;
  font-size:14px;
}
#dream-directory .dd-search-wrap input:focus,
#dream-directory .dd-search-wrap select:focus {
  border-color:#b9a3ff;
  box-shadow:0 0 0 3px #a78bfa19;
}
#dream-directory .dd-search-wrap input::placeholder {color:#a5a2bf}
#dream-directory .dd-search-wrap option {
  background:#17152e;
  color:#fff;
}
#dream-directory .dd-count {
  text-align:center;
  font-size:12px;
  color:#a7a3c7;
  letter-spacing:1px;
  margin:20px 0 25px;
}
#dream-directory .dd-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));
  gap:19px;
}
#dream-directory .dd-card {
  position:relative;
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:240px;
  padding:23px;
  border:1px solid #ffffff17;
  border-radius:19px;
  background:linear-gradient(145deg,#ffffff0c,#ffffff04);
  box-shadow:0 12px 40px #00000012;
  transition:transform .28s ease,border-color .28s ease,
             background .28s ease,box-shadow .28s ease;
  overflow:hidden;
}
#dream-directory .dd-card:before {
  content:"";
  position:absolute;
  top:-80px;
  right:-80px;
  width:160px;
  height:160px;
  border-radius:50%;
  background:#a78bfa13;
  filter:blur(20px);
  pointer-events:none;
}
#dream-directory .dd-card:hover {
  transform:translateY(-6px);
  border-color:#b9a3ff75;
  background:linear-gradient(145deg,#a78bfa17,#ffffff06);
  box-shadow:0 20px 45px #00000035,0 0 25px #a78bfa0c;
}
#dream-directory .dd-icon {
  display:grid;
  place-items:center;
  width:49px;
  height:49px;
  border:1px solid #c4b5fd35;
  border-radius:15px;
  background:linear-gradient(145deg,#a78bfa25,#f0abfc10);
  color:#ded2ff;
  font-size:23px;
  margin-bottom:21px;
}
#dream-directory .dd-category {
  color:#c4b5fd;
  font-size:10px;
  letter-spacing:1.7px;
  text-transform:uppercase;
  margin-bottom:9px;
}
#dream-directory .dd-card h3 {
  color:#fff;
  font-size:20px;
  line-height:1.4;
  overflow-wrap:anywhere;
  margin:0 0 10px;
  font-weight:700;
}
#dream-directory .dd-card p {
  color:#b9b7d0;
  font-size:13px;
  line-height:1.8;
  margin:0 0 23px;
  overflow-wrap:anywhere;
  flex:1;
}
#dream-directory .dd-visit {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  width:100%;
  padding:13px 15px;
  border:1px solid #c4b5fd40;
  border-radius:11px;
  background:linear-gradient(100deg,#a78bfa,#8b8cf8);
  color:#100d25 !important;
  font-size:13px;
  font-weight:700;
  text-decoration:none !important;
  transition:filter .2s ease,transform .2s ease;
}
#dream-directory .dd-visit:hover {
  filter:brightness(1.13);
  transform:translateY(-1px);
}
#dream-directory .dd-empty {
  grid-column:1/-1;
  text-align:center;
  color:#c4bfdc;
  padding:45px 15px;
  border:1px dashed #ffffff25;
  border-radius:16px;
}
#dream-directory .dd-footer {
  text-align:center;
  margin:36px 0 0;
  color:#8886aa;
  font-size:11px;
  letter-spacing:1px;
}
@media(max-width:520px) {
  #dream-directory {padding:17px;border-radius:16px}
  #dream-directory .dd-search-wrap {grid-template-columns:1fr}
  #dream-directory .dd-card {min-height:220px}
}
@media(prefers-reduced-motion:reduce) {
  #dream-directory .dd-card,
  #dream-directory .dd-visit {transition:none}
}
</style>

<div class="dd-hero">
  <span class="dd-label">✦ A Universe of Ideas</span>
  <h2>Discover Your<br /><span class="dd-gradient">Next Favourite</span></h2>
  <p>A curated universe of digital creations, inspiring projects
  and remarkable destinations. One collection, endless possibilities.</p>
</div>

<div class="dd-search-wrap">
  <input aria-label="Search websites" id="ddSearch" placeholder="✧ Find something extraordinary..." type="search" />
  <select aria-label="Filter websites by category" id="ddCategory">
    <option value="all">All Collections</option>
    <option value="technology">Technology</option>
    <option value="business">Business &amp; Finance</option>
    <option value="education">Education</option>
    <option value="entertainment">Entertainment</option>
    <option value="other">Other Discoveries</option>
  </select>
</div>

<div aria-live="polite" class="dd-count" id="ddCount"></div>
<div class="dd-grid" id="ddGrid"></div>

<div class="dd-footer">MADE FOR THE CURIOUS · BUILT FOR DISCOVERY</div>

<script>
(function () {
  const websites = [
    {
      title: "We Trillionaire",
      url: "https://afnanaadi003-dev.github.io/We-Trillionaire/",
      category: "business",
      description: "Explore a world of ambitious ideas, wealth and possibilities.",
      icon: "✧"
    },
    {
      title: "Your Next Creation",
      url: "https://afnanaadi003-dev.github.io/Bengal100/",
      category: "Business & Finance",
      description: "Add your own website link and introduce your creation to the world.",
      icon: "⌘"
    },
    {
      title: "The Bistro Restuarant",
      url: "https://gentle-lamington-d9a7b5.netlify.app/",
      category: "Business & Finance",
      description: "A place for knowledge, curiosity and lifelong discovery.",
      icon: "✦"
    },
    {
      title: "The Entertainment Room",
      url: "https://radiant-buttercream-347f8a.netlify.app/",
      category: "entertainment",
      description: "Your collection of stories, films and creative experiences.",
      icon: "♫"
    },
    {
      title:"Openbook",
      url: "https://afnanaadi003-dev.github.io/Ebook/",
      category: "education",
      description: "Discover innovative ideas and digital experiments to Read Books.",
      icon: "⌬"
    },
    {
      title: "Future Foundry",
      url: "",
      category: "business",
      description: "Ideas and projects focused on the possibilities of tomorrow.",
      icon: "◇"
    },
    {
      title: "Open Knowledge",
      url: "",
      category: "education",
      description: "Explore resources that inspire learning and fresh thinking.",
      icon: "✺"
    },
    {
      title: "Creative Universe",
      url: "",
      category: "other",
      description: "A home for imagination, experiments and original projects.",
      icon: "❋"
    },
    {
      title: "Beyond The Ordinary",
      url: "",
      category: "other",
      description: "A new destination waiting to be added to the collection.",
      icon: "☾"
    },
    {
      title: "The Next Destination",
      url: "",
      category: "technology",
      description: "Add another live project to your growing digital universe.",
      icon: "↗"
    }
  ];

  const grid = document.getElementById("ddGrid");
  const search = document.getElementById("ddSearch");
  const category = document.getElementById("ddCategory");
  const count = document.getElementById("ddCount");

  function render() {
    const query = search.value.toLowerCase().trim();
    const selectedCategory = category.value;

    const filtered = websites.filter(site => {
      const validUrl = /^https?:\/\/[^\s]+$/i.test(site.url);
      const matchesCategory =
        selectedCategory === "all" || site.category === selectedCategory;
      const matchesQuery =
        (site.title + " " + site.description + " " + site.url)
          .toLowerCase().includes(query);

      return validUrl && matchesCategory && matchesQuery;
    });

    count.textContent = filtered.length +
      (filtered.length === 1 ? " DESTINATION" : " DESTINATIONS");

    grid.replaceChildren();

    if (!filtered.length) {
      const empty = document.createElement("div");
      empty.className = "dd-empty";
      empty.textContent =
        "No destinations found. Try another search or add a website link.";
      grid.appendChild(empty);
      return;
    }

    filtered.forEach(site => {
      const card = document.createElement("article");
      card.className = "dd-card";

      const icon = document.createElement("div");
      icon.className = "dd-icon";
      icon.setAttribute("aria-hidden", "true");
      icon.textContent = site.icon || "✧";

      const label = document.createElement("div");
      label.className = "dd-category";
      label.textContent = site.category.replace("-", " ");

      const title = document.createElement("h3");
      title.textContent = site.title;

      const description = document.createElement("p");
      description.textContent = site.description;

      const link = document.createElement("a");
      link.className = "dd-visit";
      link.href = site.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.append(document.createTextNode("Visit Website "));
      const arrow = document.createElement("span");
      arrow.textContent = "↗";
      link.appendChild(arrow);

      card.append(icon, label, title, description, link);
      grid.appendChild(card);
    });
  }

  search.addEventListener("input", render);
  category.addEventListener("change", render);
  render();
})();
</script>
</div>
